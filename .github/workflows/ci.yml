name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cha, POSTGRES_PASSWORD: cha, POSTGRES_DB: cha }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cha" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cha:cha@localhost:5432/cha
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Unit tests
        run: python manage.py test -v 2

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Deploy to Render
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"
      - name: Check that the site is up
        if: env.HOOK != '' && env.APP_URL != ''
        run: |
          sleep 60
          for i in $(seq 1 20); do
            curl -fsS "$APP_URL/health/" && exit 0
            sleep 15
          done
          exit 1
