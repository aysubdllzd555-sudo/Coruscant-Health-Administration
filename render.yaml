# Render Blueprint: creates the PostgreSQL database and the web service.
databases:
  - name: cha-db
    plan: free
    region: frankfurt        # same region as the web service
    databaseName: cha
    user: cha

services:
  - type: web
    name: coruscant-health-administration
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    # create/upgrade the database tables, add demo data, start the server
    startCommand: python manage.py migrate --no-input && python manage.py seed_cha --demo && gunicorn config.wsgi:application
    healthCheckPath: /health/
    autoDeploy: false        # GitHub Actions deploys only after the tests pass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase: { name: cha-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DOCUMENT_MASTER_KEYS
        sync: false
