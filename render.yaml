databases:
  - name: cha-db
    plan: free
    region: frankfurt        
    databaseName: cha
    user: cha

services:
  - type: web
    name: coruscant-health-administration
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input

    startCommand: python manage.py migrate --no-input && python manage.py seed_cha --demo && gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: false          
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase: { name: cha-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DOCUMENT_MASTER_KEYS
        sync: false            
      - key: DJANGO_ALLOWED_HOSTS
        value: coruscant-health-administration.onrender.com
      - key: SEED_DEMO
        value: "1"
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"