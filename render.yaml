# One-click deploy: Render Dashboard → New → Blueprint → select this repo.
databases:
  - name: cha-db
    plan: free
    databaseName: cha
    user: cha

services:
  - type: web
    name: coruscant-health-administration
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: false          # deploys are triggered by GitHub Actions after tests pass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase: { name: cha-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DOCUMENT_MASTER_KEYS
        sync: false            # set once: "k1:<python -c 'from clinic.crypto import generate_master_key as g;print(g())'>"
      - key: DJANGO_ALLOWED_HOSTS
        value: coruscant-health-administration.onrender.com
      - key: SEED_DEMO
        value: "1"
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
