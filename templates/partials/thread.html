<section class="card">
  <div class="card-head"><h2>Messages</h2><span class="sub">Patient ↔ care team</span></div>
  <div class="thread">
    {% for m in thread %}
      <div class="bubble {% if m.sender_id == user.id %}mine{% endif %}">{{ m.body }}<small>{% if m.sender.is_doctor %}Dr. {% endif %}{{ m.sender.display_name }} · <time datetime="{{ m.created_at.isoformat }}" data-local>{{ m.created_at|date:"d M H:i" }}</time></small></div>
    {% empty %}<p class="empty">No messages yet.</p>{% endfor %}
  </div>
  <form class="composer" method="post" action="{% if user.is_patient %}{% url 'clinic:my_messages' %}{% else %}{% url 'clinic:patient_messages' patient.mrn %}{% endif %}">
    {% csrf_token %}{{ msg_form.body }}<button class="btn btn-primary">Send</button>
  </form>
</section>
