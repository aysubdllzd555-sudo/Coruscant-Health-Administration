<section class="card card-body">
  <h2>Upload a document</h2><br>
  <form method="post" action="{% url 'clinic:upload_document' patient.mrn %}" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "partials/field.html" with f=doc_form.title %}
    {% include "partials/field.html" with f=doc_form.category %}
    <label class="dropzone field">
      <p><svg><use href="#i-upload"/></svg><br>PDF, PNG, JPEG, DICOM, TXT or CSV · max 10 MB</p>
      {{ doc_form.file }}
      <span class="small mono" data-filename></span>
    </label>
    <button class="btn btn-primary btn-block">Encrypt &amp; upload</button>
  </form>
  <br>
  <div class="secure-note"><svg><use href="#i-shield"/></svg><span><b>Encrypted at rest.</b> Each file is sealed with its own AES-256-GCM key, which is itself wrapped by the CHA master key. Every download is audited.</span></div>
</section>
