{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth">
  <div class="box">
    <h1>Register</h1>
    <p class="muted">An administrator must approve your account before you can use the system.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button>Create account</button>
    </form>
  </div>
</div>
{% endblock %}
